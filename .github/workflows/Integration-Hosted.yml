# Runs the full Integration suite on GitHub-hosted runners, with every live dependency provisioned
# so no suite is allowed to skip. Called by Main/Development.IntergrationTests.yml and gated on by
# Release.yml.
#
#   * windows - builds the module, runs the DSC v2 / DSC v3 smoke tests and the DSC v3 document
#     check, then every Integration suite: WinRM loopback, the real Invoke-DscResource lifecycle,
#     the built module's pipeline end to end against real PSDscResources resources
#     (PipelineEndToEnd.Integration.tests.ps1) and against a live Azure DevOps organization through
#     AzureDevOpsDscNative (AzureDevOpsLive.Integration.tests.ps1), SSH loopback, a live
#     SecretStore vault and the runner-level suites.
#   * linux - builds the module and runs the suites that do not need a Windows host
#     ('HostedIntegration': SSH loopback, live vault, notify/using(), conditions, function
#     language), proving they hold on Linux too.
#
# scripts/Initialize-HostedIntegrationRunner.ps1 provisions the runner (SecretManagement +
# SecretStore, WinRM, dsc, a loopback sshd with a PowerShell subsystem). It refuses to run off a
# GitHub-hosted runner, because it resets SecretStore and changes machine-wide sshd/PATH settings.
# PIPELINERUNNER_REQUIRE_INTEGRATION_DEPENDENCIES then makes tests.ps1 fail on any skipped test.
#
# The live Azure DevOps suite signs in through GitHub Actions OIDC as a user-assigned managed
# identity (AuthenticationType 'WorkloadIdentity'), so no secret is stored. It needs these
# repository variables (Settings > Secrets and variables > Actions > Variables):
#
#   AZDO_ORGANIZATION - the Azure DevOps organization the throwaway projects are created in
#   AZURE_TENANT_ID   - the Entra tenant of the managed identity
#   AZURE_CLIENT_ID   - the managed identity's client ID
#
# The identity needs a federated credential trusting this repository's workflows, and must be a
# member of the organization allowed to create and delete projects. GitHub never issues an OIDC
# token to a pull request from a fork, so the suite (and with it this job) fails there.
name: Integration Tests (GitHub-hosted)

on:
  workflow_dispatch:
  workflow_call:
  # TEMPORARY: lets the hosted-integration-tests branch run this workflow directly, on push and
  # in its pull request, while the hosted setup is being proven. Remove both triggers once it is
  # green - Main/Development.IntergrationTests.yml and Release.yml call it via workflow_call.
  push:
    branches: [ "hosted-integration-tests" ]
  pull_request:

jobs:
  windows:
    name: Integration on windows-latest
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # GitHub Actions OIDC sign-in for the live Azure DevOps suite

    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell dependencies
        shell: pwsh
        run: Install-Module Datum, Datum.InvokeCommand, powershell-yaml, PSDesiredStateConfiguration, PSDscResources, AzureDevOpsDscNative -Force

      - name: Provision integration dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Initialize-HostedIntegrationRunner.ps1

      - name: Build the module
        shell: pwsh
        run: ./Build.ps1 -ResolveDependency -Tasks build

      - name: DSC v2 engine smoke test
        shell: pwsh
        run: ./scripts/Test-DscV2Smoke.ps1 -Verbose

      - name: DSC v3 engine smoke test
        shell: pwsh
        run: ./scripts/Test-DscV3Smoke.ps1 -Verbose

      - name: Verify compiled configuration is DSC v3-compliant
        shell: pwsh
        run: ./scripts/Test-DscV3ConfigDocument.ps1 -Verbose

      - name: Run integration tests
        shell: pwsh
        env:
          PIPELINERUNNER_REQUIRE_INTEGRATION_DEPENDENCIES: 'true'
          AZDO_ORGANIZATION: ${{ vars.AZDO_ORGANIZATION }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: ./tests.ps1 -type Integration

  linux:
    name: Integration on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell dependencies
        shell: pwsh
        run: Install-Module Datum, Datum.InvokeCommand, powershell-yaml -Force

      - name: Provision integration dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Initialize-HostedIntegrationRunner.ps1

      - name: Build the module
        shell: pwsh
        run: ./Build.ps1 -ResolveDependency -Tasks build

      - name: Run integration tests
        shell: pwsh
        env:
          PIPELINERUNNER_REQUIRE_INTEGRATION_DEPENDENCIES: 'true'
        run: ./tests.ps1 -type Integration -Tag HostedIntegration
