name: Main Intergration Test Status

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# The integration suite runs on GitHub-hosted runners with every live dependency provisioned
# and no skips allowed; see Integration-Hosted.yml.
jobs:
  integration:
    uses: ./.github/workflows/Integration-Hosted.yml
    secrets: inherit
    # A called workflow can only use the permissions its caller grants; id-token is for the live
    # Azure DevOps suite's GitHub Actions OIDC sign-in.
    permissions:
      contents: read
      id-token: write
