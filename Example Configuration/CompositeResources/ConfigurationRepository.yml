# Composite resource (specific to DSC.PipelineRunner.Akkodis): a reusable bundle referenced from
# a node file as `type: composite/ConfigurationRepository`. Expand-CompositeResources replaces the
# composite node with the resources below before dependsOn ordering, so they take part in the
# referencing file's dependency graph exactly as if they had been written inline.
#
# A composite shares the run's parameters/variables scope rather than getting its own: the
# composite node's `properties` are not passed in. The resources below read ProjectName,
# ProjectRepositoryName and the group-name variables that the node's Datum layers already
# resolve. A variables/parameters block declared here would be folded into that shared scope,
# overwriting any variable of the same name.
#
# See the Composite and Stub Resources wiki page.

parameters: {}

variables: {}

resources:

  - name: Configuration Git Repository
    type: AzureDevOpsDscNative/AzDoGitRepository
    dependsOn:
      - AzureDevOpsDscNative/AzDoProject/Project
    properties:
      ProjectName: $(variables('ProjectName'))
      RepositoryName: $(variables('ProjectRepositoryName'))

  - name: Configuration Git Permissions
    type: AzureDevOpsDscNative/AzDoGitPermission
    dependsOn:
      - AzureDevOpsDscNative/AzDoGitRepository/Configuration Git Repository
      - AzureDevOpsDscNative/AzDoProjectGroup/CON Readers
      - AzureDevOpsDscNative/AzDoProjectGroup/CON Board Administrators
    properties:
      ProjectName: $(variables('ProjectName'))
      RepositoryName: $(variables('ProjectRepositoryName'))
      isInherited: false
      Permissions:
        - Identity: "[$(variables('ProjectName'))]\\$(variables('ProjectGroups_Role_CONReaders'))"
          Permission:
            Read: "Allow"
        - Identity: "[$(variables('ProjectName'))]\\$(variables('ProjectGroups_Role_CONContributors'))"
          Permission:
            Read: "Allow"
            Contribute: "Allow"
            CreateBranch: "Allow"
            PullRequestContribute: "Allow"
        - Identity: "[$(variables('ProjectName'))]\\$(variables('ProjectGroups_Role_CONReleaseAdministrators'))"
          Permission:
            Read: "Allow"
            CreateTag: "Allow"
            ManageNote: "Allow"
            EditPolicies: "Allow"
            PullRequestContribute: "Allow"
        - Identity: "[$(variables('ProjectName'))]\\$(variables('ProjectGroups_Role_CONBuildAdministrators'))"
          Permission:
            Read: "Allow"
            Contribute: "Allow"
            CreateTag: "Allow"
            ManageNote: "Allow"
            PullRequestContribute: "Allow"
            EditPolicies: "Allow"
        - Identity: "[$(variables('Organization_Name'))]\\$(variables('Organization_Role_ProjectCollectionAdmins'))"
          Permission:
            Read: "Allow"
            Contribute: "Allow"
            CreateBranch: "Allow"
            CreateTag: "Allow"
            ManageNote: "Allow"
            EditPolicies: "Allow"
            RemoveOthersLocks: "Allow"
            ManagePermissions: "Allow"
