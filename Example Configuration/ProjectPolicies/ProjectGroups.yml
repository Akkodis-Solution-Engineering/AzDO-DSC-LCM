parameters: {}

variables: {
  "ProjectGroups_Role_CONBoardAdministrators": "CON Board Administrators",
  "ProjectGroups_Role_CONReaders": "CON Readers",
  "ProjectGroups_Role_CONContributors": "Contributors",
  "ProjectGroups_Role_CONBuildAdministrators": "Build Administrators",
  "ProjectGroups_Role_CONReleaseAdministrators": "CON Release Administrators",
}

resources:

  - name: CON Readers
    type: AzureDevOpsDscNative/AzDoProjectGroup
    # mergable (specific to DSC.PipelineRunner.Akkodis) declares this resource as a stub-resource
    # target: Projects/Present/Magenta.yml merges a property into it with merge_with.
    mergable: true
    dependsOn:
      - AzureDevOpsDscNative/AzDoProject/Project
    properties:
      ProjectName: $(variables('ProjectName'))
      GroupName: $(variables('ProjectGroups_Role_CONReaders'))
      GroupDescription: The following group provides members with read access to the project and codebase.

  - name: CON Board Administrators
    # preCondition is evaluated before the resource runs; $false skips it. The bare 'condition'
    # key is the deprecated spelling and still works (with a warning). Only the function-language
    # accessors on the Assert-SafeConditionExpression allow-list are permitted here: variables()
    # reads a Datum-resolved variable (a missing key returns $null rather than throwing), and
    # equals()/not() compose a side-effect-free predicate. Arguments are space-separated
    # PowerShell command syntax - `equals (variables 'X') 'Y'`, not `equals(X, Y)`, which binds
    # a single two-element array and throws. Magenta never sets Project_Service_WorkBoards, so
    # this is $false for it and the group is skipped.
    preCondition: equals (variables 'Project_Service_WorkBoards') 'enabled'
    type: AzureDevOpsDscNative/AzDoProjectGroup
    dependsOn:
      - AzureDevOpsDscNative/AzDoProject/Project
    properties:
      ProjectName: $(variables('ProjectName'))
      GroupName: $(variables('ProjectGroups_Role_CONBoardAdministrators'))
      GroupDescription: The following group provides members with administrative access to the project boards.
